#==============================
# ==== Server detail ==========
# =============================
server:
  port: 9098
  servlet:
      context-path: /api/v2
#==============================
# ==== Actuator Config=========
#==============================
management:
  endpoints:
    jmx:
      exposure:
        include: "*"
    web:
      exposure:
        include: prometheus,metrics,health
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    enable:
      jvm: true
    export:
      prometheus:
        enabled: true
    tags:
      application: my-user-redux-api
#==============================
# ==== Database detail ========
# =============================
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    mongodb:
      host: localhost
      port: 27017
      database: etl-data
#==============================
# ==== Graphql detail =========
# =============================
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      locations=classpath:graphql/:
